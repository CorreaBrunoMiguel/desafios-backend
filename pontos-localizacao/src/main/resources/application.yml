spring:
  application:
    name: pontos-localizacao
  datasource:
    url: jdbc:postgresql://localhost:5432/desafioa_db;
    username: spring
    password: spring
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080
